<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kino</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 10px;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 12px;
      }
      .title { font-weight: 600; margin-bottom: 6px; }
	  .title-wrap{
	    max-width: 100%;
	    overflow: hidden;
	  }
	.title{
	    display: inline-block;
	    max-width: 100%;
	    white-space: nowrap;
	    overflow: hidden;
	    text-overflow: ellipsis;

	    /* scrolling when too long */
	  }

	.genres { color: #444; font-size: 14px; }
    </style>
  </head>

  <body>
    <div class="container" id="grid"></div>

    <script>
      (async () => {
        const res = await fetch("/get_all_mov"); // or "/get_all_Movies" if your route is that
        const movies = await res.json();

        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        for (const m of movies) {
          const card = document.createElement("div");
          card.className = "card";
	  const file = m.file_name ?? "";
          card.innerHTML = `
    		<button onclick="location.href='/static/${file}'" style="height:100%;width:100%;text-align:left;border:none;background:transparent;padding:0;cursor:pointer;">
		  <div class = "title-wrap">
		    <div class="title">${m.name ?? ""}</div>
		  <div/>
		  <div class="genres">Genres: ${(m.genres ?? []).join(", ")}</div>
		  <div style="font-size:12px;color:#666;margin-top:8px;">
			file: ${m.file_name ?? ""}
		  </div>
          `;
          grid.appendChild(card);
        }
      })();
    </script>
  </body>
</html>
